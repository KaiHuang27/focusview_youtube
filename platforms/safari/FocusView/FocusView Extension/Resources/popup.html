<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/icon-48.png" width="44" height="44" alt="">
      <h1>FocusView</h1>
    </header>
    <p class="summary">Open a YouTube video to use zoom, rotate, mirror, and fill controls in the player.</p>
    <p class="hint">
      Press <kbd>Option</kbd> + <kbd>Shift</kbd> + <kbd>Z</kbd> or click
      <span class="zoom-icon" aria-label="the magnifying glass button">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <circle cx="15" cy="15" r="8"></circle>
          <path d="M21 21 29 29"></path>
          <path d="M15 10.8v8.4"></path>
          <path d="M10.8 15h8.4"></path>
        </svg>
      </span>
      in the YouTube player to turn zoom mode on or off.
    </p>
  </main>
</body>
</html>
