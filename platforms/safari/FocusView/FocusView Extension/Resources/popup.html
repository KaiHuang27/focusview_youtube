<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/icon-48.png" width="40" height="40" alt="">
      <div class="brand-copy">
        <h1>FocusView - Zoom for YouTube</h1>
        <p class="summary">Zoom, rotate, and mirror YouTube videos.</p>
      </div>
    </header>
    <p class="hint">
      Press <kbd>Option</kbd> + <kbd>Shift</kbd> + <kbd>Z</kbd> or click
      <span class="zoom-icon" aria-label="the magnifying glass button">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <circle cx="15" cy="15" r="8"></circle>
          <path d="M21 21 29 29"></path>
          <path d="M15 10.8v8.4"></path>
          <path d="M10.8 15h8.4"></path>
        </svg>
      </span>
      in the player to toggle zoom mode.
    </p>
    <section class="review" aria-label="App Store review">
      <p>Enjoying FocusView? A quick rating helps more people find it.</p>
      <div class="review-actions">
        <a class="review-button" href="https://apps.apple.com/app/id0000000000?action=write-review" target="_blank" rel="noopener">Rate on App Store</a>
        <a class="feedback-link" href="mailto:kai830227@gmail.com?subject=FocusView%20feedback">Send feedback</a>
      </div>
    </section>
  </main>
</body>
</html>
